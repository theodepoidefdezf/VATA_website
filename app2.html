<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 02 — VATA Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <header class="nav is-scrolled" id="nav">
    <a href="index.html" class="nav__logo" data-cursor="hover" aria-label="VATA Studio home">
      <img src="assets/images/vata-logo.png" alt="VATA Studio" />
    </a>
    <nav class="nav__menu">
      <a href="index.html#about" data-cursor="hover">About</a>
      <a href="index.html#work" data-cursor="hover">Work</a>
      <a href="index.html#founders" data-cursor="hover">Founders</a>
      <a href="index.html#contact" data-cursor="hover">Contact</a>
    </nav>
    <a href="index.html#contact" class="nav__cta" data-cursor="hover">
      <span>Get in touch</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </header>

  <main class="placeholder-page">
    <span class="placeholder-page__index">Project 02</span>
    <h1 class="placeholder-page__title">Coming&nbsp;soon</h1>
    <p class="placeholder-page__sub">A new mobile application is being crafted. Details, screens and case study will appear here in due time.</p>
    <a href="index.html" class="placeholder-page__back" data-cursor="hover">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Back to home</span>
    </a>
  </main>

  <script>
    const cursor = document.getElementById('cursor');
    const dot = document.getElementById('cursorDot');
    if (window.matchMedia('(pointer: fine)').matches) {
      let cx = innerWidth/2, cy = innerHeight/2, tx = cx, ty = cy;
      addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`; });
      const loop = () => {
        cx += (tx - cx) * 0.18;
        cy += (ty - cy) * 0.18;
        cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
        requestAnimationFrame(loop);
      };
      loop();
      document.querySelectorAll('[data-cursor]').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add(`is-${el.dataset.cursor}`));
        el.addEventListener('mouseleave', () => cursor.classList.remove(`is-${el.dataset.cursor}`));
      });
    }
  </script>
</body>
</html>
